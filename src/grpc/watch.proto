syntax = "proto3";

package quutio.bouncer;

import "scope.proto";
import "servers.proto";
import "universes.proto";

option csharp_namespace = "Bouncer.Grpc";
option java_package = "io.quut.bouncer.grpc";
option java_multiple_files = true;

message BouncerWatchRequest {
	optional Server server = 1;
	optional Universe universe = 2;

	message Server {
		repeated ServerFilter filter = 1;
		repeated Details details = 2;

		enum Details {
			NONE = 0;
			PLAYERS = 1;
			PLAYER_COUNT = 2;
			TPS = 3;
			MEMORY = 4;
		}
	}

	message Universe {
	}
}

message BouncerWatchResponse {
	oneof data {
		Server server = 1;
		Universe universe = 2;
	}

	message Server {
		int32 serverId = 1;

		oneof action {
			Add add = 2;
			ServerUpdate update = 3;
			Remove remove = 4;
		}

		message Add {
			ServerData data = 1;
			ServerState state = 2;
			optional ServerStatus status = 3;
		}

		message Remove {
			ServerRemovelReason reason = 1;
		}
	}

	message Universe {
		int32 serverId = 1;
		int32 universeId = 2;

		oneof action {
			Add add = 3;
			UniverseUpdate update = 4;
			Remove remove = 5;
		}

		message Add {
			UniverseData data = 1;
			State state = 2;
		}

		message Remove {
		}
	}
}
